# The built-in customers, used when no users are configured: fictional
# people chosen to exercise different outcomes. Loaded exactly as [[users]]
# in a configuration file are. They all sign in with the password
# "demo-password" (user::DEMO_PASSWORD); the hash is precomputed so that a
# cold start does not pay for Argon2.
#
# - demo:     an adult with every claim, a PayID and a BIC.
# - riley:    under 18, with a bank account but no PayID or BIC.
# - margaret: over 65, no middle name, PayID by mobile number.
# - sam:      sparse data: no birthdate, phone, address or bank account.

[[users]]
username = "demo"
subject = "demo-user-0001"
password_hash = "$argon2id$v=19$m=19456,t=2,p=1$1pD2JL/Druui48zrii3E7A$WfVEWbPUbl1H0N8SBiJz7RupMKJgdRJ6UzfUZ9+EkUk"

[users.claims]
# Every standard OpenID Connect claim, and so every claim the ConnectID
# profile defines.
name = "Alex Jordan Citizen"
nickname = "Al"
preferred_username = "alex"
profile = "https://example.com/people/alex"
picture = "https://example.com/people/alex.jpg"
website = "https://alex.example.com"
email_verified = true
gender = "non-binary"
zoneinfo = "Australia/Sydney"
locale = "en-AU"
phone_number_verified = true
updated_at = 1767225600 # 2026-01-01T00:00:00Z
given_name = "Alex"
middle_name = "Jordan"
family_name = "Citizen"
email = "alex.citizen@example.com"
birthdate = "1985-04-12"
phone_number = "+61 400 000 000"

[users.claims.address]
