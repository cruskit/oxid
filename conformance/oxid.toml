# oxID configuration for the conformance suite run. See docker-compose.yml.
#
# TLS certificate, signing key and pairwise salt are left unset, so oxID
# generates ephemeral ones at startup. The demo user is used for sign-in.

issuer = "https://oxid:9443"
mtls_base_url = "https://oxid:9444"

[server]
listen = "0.0.0.0:9443"
mtls_listen = "0.0.0.0:9444"

[security]
# Kept short because two suite tests wait for a request_uri to expire.
request_uri_ttl = 30

# The suite's two clients. Their keys are generated by conformance/generate.py.
[[clients]]
client_id = "oxid-conformance-1"
client_name = "Conformance Suite Client 1"
redirect_uris = ["https://localhost.emobix.co.uk:8443/test/a/oxid/callback"]
jwks_file = ".generated/client1.jwks.json"
scopes = ["openid"]
grant_types = ["authorization_code", "refresh_token"]

[[clients]]
client_id = "oxid-conformance-2"
client_name = "Conformance Suite Client 2"
# The suite gives its second client a redirect URI with a query string, to
# check that existing query parameters survive the redirect.
redirect_uris = ["https://localhost.emobix.co.uk:8443/test/a/oxid/callback?dummy1=lorem&dummy2=ipsum"]
jwks_file = ".generated/client2.jwks.json"
scopes = ["openid"]
grant_types = ["authorization_code", "refresh_token"]
