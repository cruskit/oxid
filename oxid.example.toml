# Example oxID configuration. Copy to oxid.toml and edit.
#
# Relative paths are resolved against the directory containing this file.

# The issuer identifier, and the base URL of the public listener.
issuer = "https://localhost:9443"

# The base URL of the mutual TLS listener, advertised to clients through
# mtls_endpoint_aliases for the token, PAR and UserInfo endpoints.
mtls_base_url = "https://localhost:9444"

# The user experience at the authorization endpoint:
#   "technical" (default)  no sign-in: inspect the request, pick a customer,
#                          edit the ID token claims or return an error.
#                          Development and testing only.
#   "login"                username and password sign-in with consent.
# Can be overridden with --experience or the OXID_EXPERIENCE variable.
experience = "technical"

[server]
listen = "127.0.0.1:9443"
mtls_listen = "127.0.0.1:9444"

# TLS certificate chain and key (PEM). If unset, an ephemeral self-signed
# certificate is generated at startup. Development only.
# tls_cert = "tls/server.crt"
# tls_key = "tls/server.key"

# CA bundle (PEM) that client certificates must chain to. If unset, any
# certificate the client proves possession of is accepted and access tokens
# are bound to its thumbprint (self-signed certificate mutual TLS, RFC 8705).
# client_ca = "tls/client-ca.pem"

[keys]
# RSA private key (PEM) used to sign ID tokens with PS256. If unset, a key is
# generated and kept in the store: with the memory store that means a new key
# at every start (development only); with the DynamoDB store the key is
# created once and shared by every instance.
# signing_key = "keys/signing.pem"

# Secret mixed into pairwise subject identifiers, at least 16 characters.
# If unset, a random value is generated and kept in the store, in the same
# way as the signing key.
# pairwise_salt = "change-me-to-a-long-random-string"

# Where server-side state is kept: pushed requests, codes, tokens, the client
# assertion replay cache and consent records.
[store]
# "memory" (the default) keeps it in this process. It is lost on restart and
# not shared, so it suits a single local instance.
backend = "memory"

# "dynamodb" keeps it in an Amazon DynamoDB table, shared by every instance.
# Use it wherever consecutive requests may reach different instances, such as
# AWS Lambda. It needs a build with the `aws` cargo feature. The table is
# described in deploy/aws/requirements.json. Credentials and the region come
# from the environment in the usual AWS ways.
# backend = "dynamodb"
# table = "oxid"
# region = "ap-southeast-2"               # defaults to the environment's
# endpoint_url = "http://localhost:8000"  # DynamoDB Local

# Lifetimes and tolerances, in seconds. These are the defaults. Values outside
# the limits set by FAPI 2.0 and ConnectID are refused at startup.
[security]
access_token_ttl = 300              # at most 600
refresh_token_ttl = 86400
id_token_ttl = 300
authorization_code_ttl = 60         # at most 60
request_uri_ttl = 90                # below 600; time to reach the sign-in page
session_ttl = 300                   # time to sign in and decide once there; at most 3600
request_object_max_lifetime = 600   # exp - nbf, at most 600
request_object_max_age = 600        # age of nbf, at most 600
clock_skew = 10                     # between 10 and 60

# Clients. Each needs its public keys, either in a JWK Set file or inline.
[[clients]]
client_id = "example-rp"
client_name = "Example Relying Party"
redirect_uris = ["https://rp.example.com/callback"]
jwks_file = "clients/example-rp.jwks.json"
grant_types = ["authorization_code"]   # add "refresh_token" to issue refresh tokens
# Which claims exist for this client:
#   "connectid" (default)  the ConnectID Identity Assurance Profile: given_name,
#                          middle_name, family_name, email, birthdate,
#                          phone_number, address, and the verified claims
#                          over16/18/21/25/65, beneficiary_account_au,
#                          beneficiary_account_au_payid and
#                          beneficiary_account_international. Claims are
#                          requested with the claims parameter only.
#   "oidc"                 every standard OpenID Connect claim, requested with
#                          the claims parameter or the profile, email, phone
#                          and address scopes. No verified claims.
profile = "connectid"
# For an "oidc" client that uses claim scopes, list them:
# scopes = ["openid", "profile", "email", "phone", "address"]
# The claims this client has been provisioned for, within its profile.
# Requests for anything else are ignored. Leave unset to allow the whole
# profile.
# claims = ["given_name", "family_name", "over18"]
# Needed only when redirect_uris span several hosts.
# sector_identifier = "rp.example.com"

# Load further clients from the ConnectID registry at startup. They are added
# to the clients above; a client id defined in both uses the definition above.
# If this is enabled and the registry cannot be used, oxID does not start.
#
# [client_sync]
# enabled = true
# # The registry's mutual TLS token endpoint and clients endpoint. These are
# # the sandbox ones; production is matls-auth.directory.connectid.com.au.
# token_endpoint = "https://matls-auth.directory.sandbox.connectid.com.au/token"
# clients_url = "https://matls-auth.directory.sandbox.connectid.com.au/clients"
# # Audience of the client assertion. Defaults to the token endpoint; set it
# # if the registry expects its issuer identifier instead.
# # audience = "https://auth.directory.sandbox.connectid.com.au"
# # Alternatively, give the registry's metadata document in place of
# # token_endpoint: the mutual TLS token endpoint and the audience (its
# # issuer) are then taken from it.
# # discovery_url = "https://.../.well-known/openid-configuration"
# # This provider's client id at the registry, and the scope to request.
# client_id = "00000000-0000-0000-0000-000000000000"
# scope = "directory:software"
# # Transport certificate and key (PEM) for mutual TLS.
# transport_cert = "registry/transport.pem"
# transport_key = "registry/transport.key"
# # Signing key (PEM, RSA) for the private_key_jwt assertion, and the key id
# # the registry knows it by.
# signing_key = "registry/signing.key"
# signing_key_id = "the-kid-from-the-registry"
# # Extra certificate authorities to trust for the registry (PEM bundle).
# # ca = "registry/ca.pem"
# # Results per page when reading the clients endpoint.
# page_size = 50
# # Claims profile given to these clients.
# profile = "connectid"

# Users (the customers offered by the technical experience). If this section
# is omitted entirely, four built-in demo customers are used: demo, riley,
# margaret and sam, all with the password "demo-password". Development only.
#
# password_hash is needed only to sign in under the login experience.
# Create it with:  echo 'the-password' | oxid hash-password
#
# [[users]]
# username = "alex"
# password_hash = "$argon2id$v=19$m=19456,t=2,p=1$..."
# subject = "user-0001"
#
# Any standard OpenID Connect claim can be set here: name, given_name,
# family_name, middle_name, nickname, preferred_username, profile, picture,
# website, email, email_verified, gender, birthdate, zoneinfo, locale,
# phone_number, phone_number_verified, address, updated_at.
# [users.claims]
# given_name = "Alex"
# middle_name = "Jordan"
# family_name = "Citizen"
# email = "alex.citizen@example.com"
# birthdate = "1985-04-12"
# phone_number = "+61 400 000 000"
#
# [users.claims.address]
# street_address = "1 Example Street"
# locality = "Sydney"
# region = "NSW"
# postal_code = "2000"
# country = "Australia"
#
# The user's bank account, the source of the beneficiary_account_* verified
# claims. Optional; without it those claims are simply not released.
# [users.bank_account]
# beneficiary_name = "Alex Jordan Citizen"
# bsb = "123456"                     # six digits, no separator
# account_number = "12345678"
# payid = "alex.citizen@example.com" # optional, with payid_type
# payid_type = "/EMAL"               # /EMAL, /TELI, /AUBN or /ORGN
# bic_swift_code = "OXIDAU2SXXX"     # needed for beneficiary_account_international
# account_number_international = "12345612345678"  # default: bsb + account_number
