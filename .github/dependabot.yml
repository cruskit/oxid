# Dependency updates every two weeks (the 1st and 15th of the month), one
# grouped pull request per ecosystem, so each round costs at most two CI
# runs. Security updates are raised as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: cron
      cronjob: "0 3 1,15 * *"
      timezone: Australia/Sydney
    open-pull-requests-limit: 2
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 3 1,15 * *"
      timezone: Australia/Sydney
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ["*"]
